<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />
    <script>
      // TV app: TV WebViews report a small logical width (960 px on a 1080p
      // Fire TV / Google TV), which would trigger the phone layout. Lay the UI
      // out at 1280 px instead: full TV layout, 1.5x the desktop scale, which
      // is readable from the sofa. The WebView scales it to the screen.
      (function () {
        var ua = navigator.userAgent || '';
        var landscape = window.innerWidth >= window.innerHeight;
        if (ua.indexOf('NebulaTV') !== -1 && landscape) {
          document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1280, user-scalable=no');
        }
      })();
    </script>
    
    <title>Nebula IPTV</title>
    <meta name="description" content="A modern, responsive IPTV streaming platform featuring Live TV, VOD movies, TV series, multi-view grid, EPG timeline, playlist management (M3U & Xtream Codes), profiles, and remote/TV navigation." />
    
    <!-- OpenGraph -->
    <meta property="og:title" content="Nebula IPTV" />
    <meta property="og:description" content="A modern, responsive IPTV streaming platform featuring Live TV, VOD movies, TV series, multi-view grid, EPG timeline, playlist management (M3U & Xtream Codes), profiles, and remote/TV navigation." />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-[#060608] text-[#F5F5F7] antialiased selection:bg-[#7C5CFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
