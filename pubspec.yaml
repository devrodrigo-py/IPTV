name: nebula_iptv
description: A modern multiplatform IPTV player and manager.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3

  # Database
  drift: ^2.22.1

  # Video Player
  media_kit: ^1.1.10+1
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.4

  # Web Video Player (fallback for web platform)
  video_player: ^2.9.1

  # File Picker (cross-platform)
  file_picker: ^8.0.0

  # Logging
  logger: ^2.3.0

  # Path utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # Crypto (for image cache URL hashing)
  crypto: ^3.0.7
  google_fonts: ^8.2.1
  flutter_secure_storage: ^10.3.1

  intl: any
  package_info_plus: ^9.0.1
dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/nebula_icon.png
    - assets/branding/nebula_logo_dark.png
    - assets/branding/nebula_logo_transparent.png
    - assets/branding/nebula_hero.png
