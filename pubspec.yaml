name: nebula_iptv
description: A modern multiplatform IPTV player and manager.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # Video Player
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # Logging
  logger: ^2.3.0

  # Path utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # Crypto (for image cache URL hashing)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
