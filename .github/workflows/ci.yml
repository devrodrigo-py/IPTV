name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

  android:
    name: Android TV APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 3.2.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-iptv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Publish APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: android
    # Only builds from main become releases; pull requests keep the 14-day artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nebula-iptv-debug-apk
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.2.${{ github.run_number }}
        run: |
          # A fixed asset name keeps .../releases/latest/download/nebula-iptv.apk pointing at the newest build.
          mv apk/*.apk nebula-iptv.apk
          gh release create "$TAG" nebula-iptv.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nebula IPTV ${TAG#v}" \
            --notes "APK para Android TV, Fire TV e Google TV gerado a partir de ${GITHUB_SHA::7}. Link fixo da versão mais recente: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/nebula-iptv.apk" \
            --latest
